<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ficha de Herói de Aldren Veyr, Caçador das Sombras.">
  <link rel="icon" type="image/jpeg" href="imagens/logo.jpg">
  <title>Aldren Veyr — Ficha de Herói</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
</head>
<body>
<section id="passo-4" class="secao">
      <div class="container">

        <div class="cabecalho-secao">
          <span class="tag">Passo 4 de 4</span>
          <h2>Contato com a Guilda</h2>
        </div>

        <div class="duas-colunas">
          <div class="texto-final">
            <p>A caçada nunca termina. Se você aceita os riscos de caminhar nas sombras, junte-se à guilda preenchendo o formulário ao lado.</p>
            <figure class="media">
              <img src="imagens/logo.jpg" alt="Logo da guilda">
            </figure>
          </div>

          <form class="formulario" id="formGuilda" novalidate>
            <h3>Entrar na Guilda</h3>
            
            <div class="grupo-form">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" required placeholder="Seu nome">
            </div>

            <div class="grupo-form">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="grupo-form">
              <label for="mensagem">Mensagem</label>
              <textarea id="mensagem" name="mensagem" rows="4" required placeholder="Sua mensagem para a guilda..."></textarea>
            </div>
            <p id="mensagemFormulario"></p>
            <button type="submit" class="botao botao-cheio">Enviar Juramento</button>
          </form>
        </div>

      </div>
    </section>

<div class="centro">
  <a href="arsenal.html" class="botao">← Voltar ao Arsenal</a>
</div>


<footer class="rodape">
  <div class="container">
    <p>Aldren Veyr · Caçador das Sombras · Nível 07</p>
    <p><a href="index.html">Voltar ao início</a></p>
  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
